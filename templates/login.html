<!doctype html>
<html lang="{{ current_locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t("login.title") }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='screen.css') }}">
  </head>
  <body class="admin-page">
    <main class="panel login-panel">
      <h1>{{ t("login.title") }}</h1>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post">
        <label>{{ t("login.password") }} <input name="password" type="password" required autofocus></label>
        <button type="submit">{{ t("login.sign_in") }}</button>
      </form>
      {% include "includes/language_selector.html" %}
    </main>
  </body>
</html>
