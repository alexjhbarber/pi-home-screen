<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home screen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='screen.css', v='4') }}">
  </head>
  <body
    class="home-screen"
    style="--background-colour: {{ settings.background_colour }}; --accent-colour: {{ settings.accent_colour }}; --background-image: {% if settings.background_image %}url('{{ url_for('uploaded_file', filename=settings.background_image) }}'){% else %}none{% endif %}"
  >
    <main>
      <h1 id="title">{{ settings.title }}</h1>
      <p id="message">{{ settings.message }}</p>
      <p id="timer" aria-label="60 minutes remaining">60:00</p>
    </main>
    <aside id="announcement" class="announcement" hidden aria-live="assertive">
      <p id="announcement-message"></p>
    </aside>
    <aside id="gpio-activity" class="gpio-activity" aria-live="polite"></aside>
    <script src="{{ url_for('static', filename='home.js') }}"></script>
  </body>
</html>
